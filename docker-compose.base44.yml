services:
  web:
    image: node:22-slim
    working_dir: /app
    command: sh -c "npm install --no-package-lock && npm run dev"
    ports:
      - "3000:3000"
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    env_file:
      - /run/base44/app.env
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

volumes:
  node_modules:
